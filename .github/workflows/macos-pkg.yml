name: macOS pkg build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-pkg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CLI pkg
        run: |
          chmod +x client-macos/build_pkg.sh
          ./client-macos/build_pkg.sh
      - name: Build GUI app
        run: |
          chmod +x client-macos-gui/build_app_bundle.sh
          ./client-macos-gui/build_app_bundle.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenClawVoiceChat-artifacts
          path: dist/*
