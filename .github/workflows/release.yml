name: release pkg

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Python GUI app (macOS)
        run: |
          python3 -m venv python-gui/.venv
          source python-gui/.venv/bin/activate
          pip install -r python-gui/requirements.txt
          # placeholder: package with pyinstaller later
          mkdir -p dist
          tar -czf dist/OpenClawVoiceChat-pygui.tgz python-gui
      - name: Upload artifact (manual runs)
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenClawVoiceChat-pygui
          path: dist/OpenClawVoiceChat-pygui.tgz
      - name: Create GitHub Release (tagged)
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenClawVoiceChat-pygui.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
