name: release pkg

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GUI app
        run: |
          chmod +x client-macos-gui/build_app_bundle.sh
          ./client-macos-gui/build_app_bundle.sh
      - name: Upload artifact (manual runs)
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenClawVoiceChat-app
          path: dist/*
      - name: Create GitHub Release (tagged)
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
